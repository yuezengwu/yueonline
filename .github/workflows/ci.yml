name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Check follower gallery types
        run: pnpm typecheck:visuals

      - name: Test follower gallery
        run: pnpm test:first-thousand

      - name: Set up Python for offline delivery tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test portrait delivery pipeline
        run: |
          python3 -m pip install Pillow==12.2.0
          pnpm test:first-thousand:delivery

      - name: Build
        run: pnpm build
